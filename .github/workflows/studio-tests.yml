name: Studio unit tests

on:
  push:
    branches:
      - feature/studio-expansion
    paths:
      - "app/studio/**"
      - "app/studio_tab.py"
      - "app/recap_planner.py"
      - "recap_runtime/services/ai_service.py"
      - "tests/test_studio_tools.py"
      - "requirements.txt"
      - ".env.example"
      - "README.md"
      - "STUDIO_FEATURES.md"
      - ".github/workflows/studio-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pillow requests google-genai==2.25.0
      - name: Run offline Studio tests
        run: python -m unittest discover -s tests -p "test_studio_tools.py" -v
