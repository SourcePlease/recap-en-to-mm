name: Studio unit tests

on:
  push:
    branches:
      - feature/studio-expansion
    paths:
      - "app/studio/**"
      - "app/studio_tab.py"
      - "app/controller.py"
      - "app/recap_planner.py"
      - "recap_runtime/services/ai_service.py"
      - "tests/test_studio_tools.py"
      - "requirements.txt"
      - ".env.example"
      - "README.md"
      - "STUDIO_FEATURES.md"
      - ".github/workflows/studio-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile all Python source
        run: python -m compileall -q app recap_runtime tests
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
