name: Studio unit tests

on:
  push:
    branches:
      - feature/studio-expansion
    paths:
      - "app/**"
      - "recap_runtime/**"
      - "tests/**"
      - "requirements.txt"
      - ".env.example"
      - ".gitignore"
      - "glossary.example.json"
      - "README.md"
      - "STUDIO_*.md"
      - "GPU_SETUP.md"
      - ".github/workflows/studio-tests.yml"
  workflow_dispatch:

concurrency:
  group: studio-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  studio-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure FFmpeg and Myanmar fonts
        shell: bash
        run: |
          packages=()
          if ! command -v ffmpeg >/dev/null 2>&1; then
            packages+=(ffmpeg)
          fi
          if ! command -v fc-match >/dev/null 2>&1 || ! fc-match "Noto Sans Myanmar" | grep -qi "noto"; then
            packages+=(fontconfig fonts-noto-core)
          fi
          if (( ${#packages[@]} > 0 )); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
          ffmpeg -version | head -n 1
          fc-match "Noto Sans Myanmar" || true
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile all Python source
        run: python -m compileall -q app recap_runtime tests
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
